[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cigma-reproducibility-artifact"
version = "0.2.0"
description = "Deterministic evidence-grounded benchmark for CIGMA"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy",
  "pandas",
  "scikit-learn",
  "scipy",
  "matplotlib",
  "PyYAML",
]

[project.scripts]
cigma-artifact = "cigma.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
