{% include base_path %}
<div class="entete">
  <a class="nom" href="{{ base_path }}/">{{ site.title }}</a>
  <p class="nav">[ <a href="{{ base_path }}/">Accueil</a>{% for link in site.data.navigation.main %}{% if link.url contains 'http' %}{% assign domain = '' %}{% else %}{% assign domain = base_path %}{% endif %} | <a href="{{ domain }}{{ link.url }}">{{ link.title }}</a>{% endfor %} ]</p>
</div>
