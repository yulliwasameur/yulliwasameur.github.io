{% include base_path %}
<div class="masthead">
  <div class="masthead__inner-wrap"><div class="masthead__menu">
    <nav id="site-nav" class="greedy-nav" aria-label="Navigation principale" data-fr-aria="Navigation principale" data-en-aria="Primary navigation" data-kab-aria="Inig agejdan">
      <button class="greedy-nav__toggle" aria-label="Ouvrir le menu" data-fr-aria="Ouvrir le menu" data-en-aria="Open menu" data-kab-aria="Ldi umuɣ"><div class="navicon"></div></button>
      <ul class="visible-links">
        <li class="masthead__menu-item masthead__menu-item--lg"><a href="{{ base_path }}/" data-lang-link aria-label="Accueil — Yulliwas Ameur" data-fr-aria="Accueil — Yulliwas Ameur" data-en-aria="Home — Yulliwas Ameur" data-kab-aria="Agejdan — Yulliwas Ameur"><span class="site-brand-mark" aria-hidden="true">YA</span><span class="site-brand-name">{{ site.title }}</span></a></li>
        {% for link in site.data.navigation.main %}{% if link.url contains 'http' %}{% assign domain = '' %}{% else %}{% assign domain = base_path %}{% endif %}
        <li class="masthead__menu-item{% if link.featured %} masthead__menu-item--featured{% endif %}"><a href="{{ domain }}{{ link.url }}" data-nav-key="{{ link.key }}"{% if link.featured %} data-radar-link{% else %} data-lang-link{% endif %}>{{ link.title }}</a></li>{% endfor %}
      </ul>
      <ul class="hidden-links hidden"></ul>
      <div class="site-nav-tools"><div class="site-language" role="group" aria-label="Langue" data-fr-aria="Langue" data-en-aria="Language" data-kab-aria="Tutlayt"><button type="button" data-site-lang="fr" aria-pressed="true">FR</button><button type="button" data-site-lang="en" aria-pressed="false">EN</button><button type="button" data-site-lang="kab" aria-pressed="false">TQ</button></div><button class="site-theme-toggle" type="button" data-theme-toggle aria-label="Changer de thème" data-fr-aria="Changer de thème" data-en-aria="Change theme" data-kab-aria="Beddel asentel"><span aria-hidden="true"></span></button></div>
    </nav>
  </div></div>
  <div class="site-scroll-progress" aria-hidden="true"><span></span></div>
</div>
