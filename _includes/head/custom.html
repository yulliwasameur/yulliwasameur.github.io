{% include base_path %}

<!-- start custom head snippets -->

<link rel="apple-touch-icon" href="{{ base_path }}/images/profile.png">
<link rel="icon" type="image/png" href="{{ base_path }}/images/profile.png">
<link rel="mask-icon" href="{{ base_path }}/images/safari-pinned-tab.svg?v=M44lzPylqQ" color="#007f82">
<meta name="msapplication-TileColor" content="#061219">
<meta name="msapplication-TileImage" content="{{ base_path }}/images/mstile-144x144.png?v=M44lzPylqQ">
<meta name="msapplication-config" content="{{ base_path }}/images/browserconfig.xml?v=M44lzPylqQ">
<meta name="theme-color" content="#061219">
<link rel="stylesheet" href="{{ base_path }}/assets/css/academicons.css"/>

{% if page.url == "/" %}
<link rel="alternate" hreflang="fr" href="{{ site.url }}/?lang=fr">
<link rel="alternate" hreflang="en" href="{{ site.url }}/?lang=en">
<link rel="alternate" hreflang="kab" href="{{ site.url }}/?lang=kab">
<link rel="alternate" hreflang="x-default" href="{{ site.url }}/">
{% endif %}

<script type="text/x-mathjax-config"> MathJax.Hub.Config({ TeX: { equationNumbers: { autoNumber: "all" } } }); </script>
<script type="text/x-mathjax-config">
  MathJax.Hub.Config({
    tex2jax: {
      inlineMath: [ ['$','$'], ["\\(","\\)"] ],
      processEscapes: true
    }
  });
</script>
<script src='https://cdnjs.cloudflare.com/ajax/libs/mathjax/2.7.4/latest.js?config=TeX-MML-AM_CHTML' async></script>

<!-- end custom head snippets -->
